spring.application.name=redstar-backend

spring.datasource.url=${REDSTAR_DATASOURCE_URL:jdbc:postgresql://localhost:${REDSTAR_POSTGRES_PORT:5432}/redstar}
spring.datasource.username=${REDSTAR_DATASOURCE_USERNAME:redstar}
spring.datasource.password=${REDSTAR_DATASOURCE_PASSWORD:redstar}
spring.flyway.enabled=true

jobrunr.job-scheduler.enabled=true
jobrunr.background-job-server.enabled=false
jobrunr.dashboard.enabled=false
jobrunr.miscellaneous.allow-anonymous-data-usage=false

management.endpoints.web.exposure.include=health,info
springdoc.show-actuator=false
springdoc.swagger-ui.enabled=false

logging.structured.format.console=ecs
logging.structured.ecs.service.name=redstar-backend

redstar.storage.local.root=${REDSTAR_DOCUMENT_STORAGE_ROOT:./var/documents}
redstar.identity.dev.user-id=${REDSTAR_DEV_USER_ID:00000000-0000-0000-0000-000000000001}
redstar.identity.dev.organization-id=${REDSTAR_DEV_ORGANIZATION_ID:00000000-0000-0000-0000-000000000002}
redstar.identity.dev.roles=${REDSTAR_DEV_ROLES:ADMIN}
