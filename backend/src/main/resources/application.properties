spring.application.name=rivell-backend

spring.datasource.url=${RIVELL_DATASOURCE_URL:jdbc:postgresql://localhost:${RIVELL_POSTGRES_PORT:5432}/rivell}
spring.datasource.username=${RIVELL_DATASOURCE_USERNAME:rivell}
spring.datasource.password=${RIVELL_DATASOURCE_PASSWORD:rivell}
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=${RIVELL_UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${RIVELL_UPLOAD_MAX_REQUEST_SIZE:10MB}

rivell.contracts.upload.max-file-size=${RIVELL_UPLOAD_MAX_FILE_SIZE:10MB}

rivell.docx-parser.max-uncompressed-bytes=${RIVELL_DOCX_MAX_UNCOMPRESSED_BYTES:209715200}
# How many Word or Excel files are parsed, redlined or verified at the same moment. Each file is
# held in memory whole, so this bounds peak heap. Extra requests wait up to max-wait, then are
# refused with 503 and Retry-After so their upload bytes do not queue indefinitely.
rivell.document-work.max-concurrent=${RIVELL_DOCUMENT_WORK_MAX_CONCURRENT:2}
rivell.document-work.max-wait=${RIVELL_DOCUMENT_WORK_MAX_WAIT:30s}

rivell.intelligence.provider=${RIVELL_INTELLIGENCE_PROVIDER:jev}
rivell.review.policy-comparison.order-probe=${RIVELL_ORDER_PROBE:off}
rivell.review.omissions=${RIVELL_REVIEW_OMISSIONS:false}
# The walk-away absence check: one last check reports a walk-away ("No termination for
# convenience") as a missing provision when no clause addresses the position, and names the
# clause that matches it when one does. On by default; never on a child type (SOW, DPA, order
# form, amendment).
rivell.review.walk-away-absence.enabled=${RIVELL_REVIEW_WALK_AWAY_ABSENCE:true}
rivell.review.definitions=${RIVELL_REVIEW_DEFINITIONS:false}
# severity R3 experiment (P7): P1 agreed second opinion lends its worse category; P2 routes a WITHIN
# judgement to the second opinion when BEYOND+WALK_AWAY mass reaches the margin (negative = off);
# P3 checks the conditions of the listed fallback for every final WITHIN and reports them on the
# finding (it never raises the category)
rivell.review.severity.agreed-worse-category=${RIVELL_REVIEW_AGREED_WORSE_CATEGORY:true}
# R1 calibration: a disagreement the second opinion calls a walk-away or beyond-fallback raises
# the item to MEDIUM only when the fallback-condition check found it PARTIAL or the whole-contract
# read named the clause. Off keeps R1 as it shipped (every such disagreement is MEDIUM).
rivell.review.severity.r1-needs-corroboration=${RIVELL_REVIEW_R1_NEEDS_CORROBORATION:false}
rivell.review.routing.within-split-margin=${RIVELL_REVIEW_WITHIN_SPLIT_MARGIN:0.45}
rivell.review.fallback-conditions.enabled=${RIVELL_REVIEW_FALLBACK_CONDITIONS:true}
# whole-review wall-clock budget; checks not started when it is spent degrade as
# review_deadline_exceeded so the review still completes under the all-degraded rule.
# A resumed attempt gets its own budget; one run is capped at this budget times
# (max-transient-failures + 1).
rivell.review.analysis-budget=${RIVELL_REVIEW_ANALYSIS_BUDGET:30m}
# how many transient infrastructure failures (dropped connection, statement timeout, reclaimed
# lease) one run may survive before it is failed terminally. 0 makes every transient failure terminal.
rivell.review.max-transient-failures=${RIVELL_REVIEW_MAX_TRANSIENT_FAILURES:3}
# waits before each retry of a call whose provider is briefly unavailable (429, 5xx, timeout)
rivell.intelligence.retry-backoff=${RIVELL_INTELLIGENCE_RETRY_BACKOFF:2s,8s,30s}
# absolute time one call may spend across attempts (a single attempt keeps its read timeout)
rivell.intelligence.retry-max-elapsed=${RIVELL_INTELLIGENCE_RETRY_MAX_ELAPSED:90s}
# in-flight calls per provider id; one review makes one call at a time
rivell.intelligence.max-concurrent.jev=${RIVELL_INTELLIGENCE_MAX_CONCURRENT_JEV:16}
rivell.intelligence.max-concurrent.openai-compatible=${RIVELL_INTELLIGENCE_MAX_CONCURRENT_OPENAI:8}
rivell.intelligence.max-concurrent.openai-decider=${RIVELL_INTELLIGENCE_MAX_CONCURRENT_OPENAI_DECIDER:8}
rivell.intelligence.max-concurrent.embeddings=${RIVELL_INTELLIGENCE_MAX_CONCURRENT_EMBEDDINGS:8}
rivell.intelligence.jev.base-url=${TYPESAFE_BASE_URL:https://api.typesafe.ai}
rivell.intelligence.jev.api-key=${TYPESAFE_API_KEY:}
rivell.intelligence.jev.model=${TYPESAFE_MODEL:jev-1.13.0}
rivell.intelligence.jev.connect-timeout=${TYPESAFE_CONNECT_TIMEOUT:2s}
rivell.intelligence.jev.read-timeout=${TYPESAFE_READ_TIMEOUT:20s}
rivell.intelligence.classification.concept-threshold=${RIVELL_CONCEPT_THRESHOLD:0.80}

jobrunr.job-scheduler.enabled=true
# Background worker is opt-in per deployment: without it, enqueued analysis jobs
# persist but are not executed (tests/CI stay worker-free).
jobrunr.background-job-server.enabled=${RIVELL_JOB_WORKER_ENABLED:false}
jobrunr.dashboard.enabled=false
jobrunr.miscellaneous.allow-anonymous-data-usage=false

management.endpoints.web.exposure.include=health,info
springdoc.show-actuator=false
springdoc.swagger-ui.enabled=false

logging.structured.format.console=ecs
logging.structured.ecs.service.name=rivell-backend

rivell.storage.local.root=${RIVELL_DOCUMENT_STORAGE_ROOT:./var/documents}
rivell.identity.dev.user-id=${RIVELL_DEV_USER_ID:00000000-0000-0000-0000-000000000001}
rivell.identity.dev.organization-id=${RIVELL_DEV_ORGANIZATION_ID:00000000-0000-0000-0000-000000000002}
rivell.identity.dev.roles=${RIVELL_DEV_ROLES:ADMIN}
rivell.intelligence.generative.provider=${RIVELL_INTELLIGENCE_GENERATIVE_PROVIDER:openai-compatible}
rivell.intelligence.generative.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
rivell.intelligence.generative.api-key=${OPENAI_API_KEY:}
rivell.intelligence.generative.model=${OPENAI_MODEL:gpt-6-luna}
rivell.intelligence.generative.response-mode=${RIVELL_INTELLIGENCE_GENERATIVE_RESPONSE_MODE:strict-schema}
# temperature unset = omitted from the wire (provider default). Reasoning-family
# models (gpt-5+/gpt-6+) only accept their default; set explicitly for older models.
rivell.intelligence.generative.temperature=${OPENAI_TEMPERATURE:}
# reasoning_effort for generation and decisions (OpenAI format; OpenRouter and Ollama accept it too).
# enabled=false sends "none" (no reasoning). enabled=true sends the effort below, or the provider
# default when it is blank. Leave enabled blank for models that reject the field (e.g. gpt-4o-mini).
# Default: on at the provider default (nothing sent), the setting all evals ran at.
rivell.intelligence.generative.reasoning.enabled=${OPENAI_REASONING_ENABLED:true}
rivell.intelligence.generative.reasoning.effort=${OPENAI_REASONING_EFFORT:}
rivell.intelligence.generative.connect-timeout=${OPENAI_CONNECT_TIMEOUT:5s}
rivell.intelligence.generative.read-timeout=${OPENAI_READ_TIMEOUT:45s}
# the whole-contract spotter may legitimately run past the ordinary read timeout on a slow model
rivell.intelligence.generative.long-read-timeout=${OPENAI_LONG_READ_TIMEOUT:180s}
# embeddings: any OpenAI-compatible transport (OpenAI, OpenRouter, local Ollama).
# Key empty by default -> embeddings unconfigured (honest degradation, network-free CI).
# Local Ollama wiring (no real secret needed; Ollama ignores auth):
#   RIVELL_EMBEDDINGS_BASE_URL=http://localhost:11434/v1
#   RIVELL_EMBEDDINGS_API_KEY=ollama
#   RIVELL_EMBEDDINGS_MODEL=embeddinggemma
#   RIVELL_EMBEDDINGS_DIMENSIONS=768
rivell.intelligence.embeddings.provider=${RIVELL_EMBEDDINGS_PROVIDER:}
rivell.intelligence.embeddings.base-url=${RIVELL_EMBEDDINGS_BASE_URL:https://api.openai.com/v1}
rivell.intelligence.embeddings.api-key=${RIVELL_EMBEDDINGS_API_KEY:}
rivell.intelligence.embeddings.model=${RIVELL_EMBEDDINGS_MODEL:}
rivell.intelligence.embeddings.max-inputs-per-batch=${RIVELL_EMBEDDINGS_MAX_BATCH:64}

rivell.retrieval.indexing-enabled=${RIVELL_RETRIEVAL_INDEXING_ENABLED:true}
rivell.retrieval.reconciliation-cron=${RIVELL_RETRIEVAL_RECONCILIATION_CRON:}
rivell.retrieval.reconciliation-batch-size=${RIVELL_RETRIEVAL_RECONCILIATION_BATCH_SIZE:100}

# --- Local demo data -----------------------------------------------------------------
# Off unless a developer explicitly opts in. When enabled, a runner populates fictional
# demo contracts, reviews and published knowledge so Home has something to show. This is
# local demonstration data only: it is never created by a Flyway migration, never enabled
# in production, and must stay off for any real deployment.
rivell.demo.seed-enabled=${RIVELL_DEMO_SEED_ENABLED:false}
