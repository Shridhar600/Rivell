spring.application.name=rivell-backend

spring.datasource.url=${RIVELL_DATASOURCE_URL:jdbc:postgresql://localhost:${RIVELL_POSTGRES_PORT:5432}/rivell}
spring.datasource.username=${RIVELL_DATASOURCE_USERNAME:rivell}
spring.datasource.password=${RIVELL_DATASOURCE_PASSWORD:rivell}
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=${RIVELL_UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${RIVELL_UPLOAD_MAX_REQUEST_SIZE:10MB}

rivell.contracts.upload.max-file-size=${RIVELL_UPLOAD_MAX_FILE_SIZE:10MB}

rivell.docx-parser.max-uncompressed-bytes=${RIVELL_DOCX_MAX_UNCOMPRESSED_BYTES:209715200}

jobrunr.job-scheduler.enabled=true
jobrunr.background-job-server.enabled=false
jobrunr.dashboard.enabled=false
jobrunr.miscellaneous.allow-anonymous-data-usage=false

management.endpoints.web.exposure.include=health,info
springdoc.show-actuator=false
springdoc.swagger-ui.enabled=false

logging.structured.format.console=ecs
logging.structured.ecs.service.name=rivell-backend

rivell.storage.local.root=${RIVELL_DOCUMENT_STORAGE_ROOT:./var/documents}
rivell.identity.dev.user-id=${RIVELL_DEV_USER_ID:00000000-0000-0000-0000-000000000001}
rivell.identity.dev.organization-id=${RIVELL_DEV_ORGANIZATION_ID:00000000-0000-0000-0000-000000000002}
rivell.identity.dev.roles=${RIVELL_DEV_ROLES:ADMIN}
